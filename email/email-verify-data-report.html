<style type="text/css">
.vinbox style, .vinbox script, .vinbox head, .vinbox link, .vinbox meta {display: none !important;}

.font-bold {font-family: Microsoft YaHei UI-Bold, Microsoft YaHei UI;font-weight: bold}
.font-regular {font-family: Microsoft YaHei UI-Regular, Microsoft YaHei UI;font-weight: 400}
.font-success{color: #24CCA7!important;}
.font-warning{color: #FFC700!important;}
.font-error{color: #F1416C!important;}
.font-normal{color: #313344!important;}

.bg-success{background: #24CCA7;}
.bg-warning{background: #FFC700;}
.bg-error{background: #F1416C;}

.content-list, .content-list div {overflow: auto}
.content-list p {margin:8px 0;width: 33.3%;float:left;}
.content-list div>p:nth-child(2) {text-align: center}
.content-list div>p:nth-child(2)>span {text-align: left}
.content-list div>p:nth-child(3) {text-align: right}
.content-list div>p:nth-child(3)>span {text-align: left}
.content-list p>span {vertical-align: top;}
.content-list p>span:nth-child(1) {font-family: Microsoft YaHei UI-Regular, Microsoft YaHei UI;display: inline-block;width: 120px;height: 18px;font-size: 14px;font-weight: 400;color: #6B6F85;line-height: 16px;word-break: break-all;}
.content-list p>span:nth-child(2) {font-family: Microsoft YaHei UI-Bold, Microsoft YaHei UI;display: inline-table;width: 160px;height: 18px;font-size: 14px;font-weight: bold;color: #313344;line-height: 16px;word-break: break-all;}

.bottom-info span {display: inline-block;height: 23px;font-size: 12px;font-weight: 400;color: #6C757D;line-height: 23px;}

.display-hide {display: none}
.display-show {display: table}
.content-table {word-break: break-all}
.content-table th {font-family: Microsoft YaHei UI-Regular, Microsoft YaHei UI;height: 50px;background: #F5F8FA;font-size: 14px;font-weight: 400;color: #313344;line-height: 16px;padding-left: 18px;border-top: 1px solid #EFF2F5;border-bottom: 1px solid #EFF2F5;}
.content-table th:nth-child(1), .content-table th:nth-child(3), .content-table th:nth-child(4) {width: 20%;}
.content-table td {font-family: Microsoft YaHei UI-Regular, Microsoft YaHei UI;height: 50px;background: #FFFFFF;font-size: 12px;font-weight: 400;color: #6B6F85;line-height: 14px;padding-left: 18px;border-bottom: 1px solid #F3F6F9;}
.content-table td>span {display: table-cell;text-align: center;vertical-align: middle;width: 47px;height: 27px;border-radius: 6px;font-weight: bold;}
.vm-status-success{background: #E8FFF3 !important;color: #24CCA7 !important; display:inline-block !important;width:51px !important; padding:2px !important; border-radius: 4px !important; text-align: center !important;}
.vm-status-error{background: #FFF5F8 !important;color: #F1416C !important; display:inline-block !important;width:51px !important; padding:2px !important; border-radius: 4px !important;text-align: center !important;}
.vm-status-waiting{background: #F1FAFF !important;color: #00A3FF !important; display:inline-block !important;width:51px !important; padding:2px !important; border-radius: 4px !important;text-align: center !important;}

#object_list{
    padding: 0;
}
#object_list li{
    background: #FFFFFF;
    border-radius: 4px 4px 4px 4px;
    border: 1px solid #E6E6E6;
    width: 912px;
    height: 272px;
    overflow-y:auto;
    padding: 20px;
    margin-bottom: 10px;
}

.screenshot-title{margin-top: 50px;display: inline-block;height: 18px;font-size: 14px;font-weight: 400;color: #6B6F85;line-height: 16px;}
</style>
