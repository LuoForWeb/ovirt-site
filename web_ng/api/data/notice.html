<style type="text/css">
    .vinbox style,
    .vinbox script,
    .vinbox head,
    .vinbox link,
    .vinbox meta {
        display: none !important;
    }

    .font-bold {
        font-family: Microsoft YaHei UI-Bold, Microsoft YaHei UI;
        font-weight: bold
    }

    .font-regular {
        font-family: Microsoft YaHei UI-Regular, Microsoft YaHei UI;
        font-weight: 400
    }

    .font-success {
        color: #24CCA7 !important;
    }

    .font-warning {
        color: #FFC700 !important;
    }

    .font-error {
        color: #F1416C !important;
    }

    .font-normal {
        color: #313344 !important;
    }

    .bg-success {
        background: #24CCA7;
    }

    .bg-warning {
        background: #FFC700;
    }

    .bg-error {
        background: #F1416C;
    }

    .content-list,
    .content-list div {
        overflow: auto
    }

    .content-list p {
        margin: 8px 0;
        float: left;
    }

    .content-list div>p:nth-child(2) {
        text-align: center
    }

    .content-list div>p:nth-child(2)>span {
        text-align: left
    }

    .content-list div>p:nth-child(3) {
        text-align: right
    }

    .content-list div>p:nth-child(3)>span {
        text-align: left
    }

    .content-list p>span {
        vertical-align: top;
    }

    .content-list p>span:nth-child(1) {
        font-family: Microsoft YaHei UI-Regular, Microsoft YaHei UI;
        display: inline-block;
        height: 18px;
        font-size: 14px;
        font-weight: 400;
        color: #4D4D4D;
        line-height: 24px;
        word-break: break-all;

    }

    .content-list p>span:nth-child(2) {
        font-family: Microsoft YaHei UI-Bold, Microsoft YaHei UI;
        display: inline-table;
        height: 18px;
        font-size: 14px;
        font-weight: bold;
        color: #1A1A1A;
        line-height: 24px;

    }

    .bottom-info span {
        display: inline-block;
        height: 23px;
        font-size: 12px;
        font-weight: 400;
        color: #666666;
        line-height: 23px;
    }

    .display-hide {
        display: none
    }

    .display-show {
        display: table
    }

    .content-table {
        word-break: break-all
    }

    .content-table th {
        font-family: Microsoft YaHei UI-Regular, Microsoft YaHei UI;
        height: 50px;
        background: #F5F8FA;
        font-size: 14px;
        font-weight: 400;
        color: #313344;
        line-height: 16px;
        padding-left: 18px;
        border-top: 1px solid #EFF2F5;
        border-bottom: 1px solid #EFF2F5;
    }

    .content-table th:nth-child(1),
    .content-table th:nth-child(2),
    .content-table th:nth-child(3),
    .content-table th:nth-child(4),
    .content-table th:nth-child(5),
    .content-table th:nth-child(6) {
        width: 20%;
    }

    .content-table td {
        font-family: Microsoft YaHei UI-Regular, Microsoft YaHei UI;
        height: 50px;
        background: #FFFFFF;
        font-size: 12px;
        font-weight: 400;
        color: #6B6F85;
        line-height: 14px;
        padding-left: 18px;
        border-bottom: 1px solid #F3F6F9;
    }

    .content-table td>span {
        display: table-cell;
        text-align: center;
        vertical-align: middle;
        width: 47px;
        height: 27px;
        border-radius: 6px;
        font-weight: bold;
    }
    #template-param4{
        width: 920px;
    }
    #template-param4 a{
        word-break: break-all;
        overflow-wrap: break-word;
        text-decoration: underline;
        color: #00C0D3;
        line-height: 22px;
    }
    #template-param4 span{
        font-size: 14px;
        font-weight: 400;
        color: #4D4D4D;
        padding-top: 20px;
        line-height: 24px;
    }

    .vm-status-success {
        background: #E8FFF3;
        color: #24CCA7;
    }

    .vm-status-error {
        background: #FFF5F8;
        color: #F1416C;
    }

    .vm-status-waiting {
        background: #F1FAFF;
        color: #00A3FF;
    }

    .content-list > div {
        display: table;
        width: 100%;
        margin-bottom: 8px;
    }

    .content-list > div > p {
        display: table-row;
        vertical-align: top; /* 顶部对齐 */
    }

    /* 第一个 span：标签列，固定宽度 */
    .content-list > div > p > span:nth-child(1) {
        display: table-cell;
        width: 130px; /* 固定宽度，确保对齐 */
        text-align: left;
        vertical-align: top;
        padding-right: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 第二个 span：值列，自动扩展 */
    .content-list > div > p > span:nth-child(2) {
        display: table-cell;
        text-align: left;
        vertical-align: top;
        word-break: break-all; /* 长文本换行 */
        width: 780px;
    }

</style>
